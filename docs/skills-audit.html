# Agent skills audit — 2026-09-28

Scope: `~/.agents/skills/` (the single canonical store; `~/.pi/agent/skills` and
`~/.claude/skills` were retired in favor of it). 69 skills total, installed over
time via `npx skills add &lt;source&gt;` from five upstream registries
(`vercel-labs/skills`, `anthropics/skills`, `vercel-labs/agent-skills`,
`mattpocock/skills`, `github/awesome-copilot`) plus a handful of one-off adds
(`blader/humanizer`, image-gen and design-taste packs).

Rating legend:
- **Need**: High (use routinely across most projects) / Medium (useful for a
  specific stack or occasional task) / Low (niche, speculative, or superseded)
- **Conflicts**: other skills whose trigger conditions overlap enough that Pi
  could reasonably load the wrong one for the same request
- **Lose?**: safe to delete without losing real capability
- **Security**: None / Low / Medium / High — based on bundled executables,
  scripts that run automatically, or write access to hook/config files outside
  the skill's own directory

## 1. Top-line findings

1. **One skill carries real security weight: `impeccable`.** It ships a 12MB
   compiled Mach-O binary (`scripts/bin/darwin-arm64/impeccable`), a live
   browser-automation harness (`live-browser.js`, `live-browser-session.js`),
   and a documented mechanism (`reference/hooks.md`) for writing into
   `.claude/settings.local.json`, `.codex/hooks.json`, `.cursor/hooks.json`,
   `.grok/hooks/impeccable.json`, and the team-shared, git-committed
   `.github/hooks/impeccable.json` — i.e. it installs auto-running PostToolUse/
   PreToolUse hooks into whatever project you're in. That's the single biggest
   attack surface in the whole set: a hook config that fires on every edit,
   written by a skill, to a file other tools trust implicitly. Nothing else
   here comes close.
2. **~28 of 69 skills (40%) are one large overlapping "make UI/frontend good"
   cluster** (design taste, image generation, visual style, review, framework
   guidance). Many trigger on generic verbs (`design`, `improve`, `review`,
   `UI`) with no mutually exclusive scope, so two or three could plausibly
   match one request and only one gets picked — silently, since Pi keeps the
   first discovered skill on a name collision and only warns for actual name
   collisions, not overlapping descriptions.
3. **A coherent ~20-skill "mattpocock/skills" engineering pipeline** (ask-matt,
   grill-*, to-spec, to-tickets, triage, wayfinder, teach, handoff,
   domain-modeling, codebase-design, writing-great-skills,
   setup-matt-pocock-skills, implement, improve-codebase-architecture,
   research, resolving-merge-conflicts, tdd, diagnosing-bugs, skill-creator,
   write-a-skill, find-skills, documentation/documentation-writer) is
   internally consistent by design — most explicitly cross-reference each
   other rather than compete. Low conflict risk, but it's a lot of surface
   area if you don't actually run a ticket-tracker-driven workflow.
4. **Framework-specific clusters (Expo/RN, Flutter, Go, Svelte, Vite/Vitest)**
   are narrow and well-scoped by description, so they don't conflict with each
   other or the UI cluster — but they're dead weight if you don't touch that
   stack. Pure "need" question, not a conflict/security one.
5. Explicit, acknowledged duplicates already flagged by their own
   descriptions: `design-taste-frontend-v1` (legacy of `design-taste-frontend`)
   and the general/React split (`performance` vs `vercel-react-best-practices`,
   not a true duplicate — different scope, kept separate below).

## 2. Security-relevant skills (only ones worth a second look)

| Skill | What it bundles | Risk | Why |
|---|---|---|---|
| `impeccable` | 12MB compiled arm64 binary, live-browser JS harness, hook installer targeting 5 different tool configs incl. a git-committed GitHub Copilot hook file | **High** | Only skill that writes auto-executing hook config into project files, and the only one shipping a compiled executable rather than scripts/text. Review `reference/hooks.md` before ever running `impeccable hooks on` in a shared repo — it can install a hook that survives you and fires for every collaborator via the committed `.github/hooks/impeccable.json` path. |
| `ui-ux-pro-max` | Python scripts (`design_system.py`, `core.py`, `search.py`) + ~30 CSV data files | Low–Medium | Scripts only run if the skill/model explicitly invokes them; no auto-hooks. Reasonable as long as you don't blindly `python3` unknown args. |
| `ui-design-system` | `scripts/shadcn_add.py`, `scripts/tailwind_config_gen.py`, bundled `.ttf` font binaries | Low–Medium | Same shape as above: on-demand scripts, not auto-run. Font binaries are inert assets. |
| `skill-creator` | `scripts/run_eval.py`, `package_skill.py`, an eval-viewer with its own HTML/JS | Low | Meta-tooling for building skills, on-demand execution only. |
| `humanizer` | `scripts/validate-package.py`, `.claude-plugin/{marketplace,plugin}.json`, `.github/workflows/validate.yml` | Low | Packaged as a distributable Claude plugin; the workflow file only runs in the upstream `blader/humanizer` repo's own CI, not yours. |
| `diagnosing-bugs` | `scripts/hitl-loop.template.sh` | Low | Template shell script, copied and edited per use, not auto-run. |

Everything else in the 69 is pure Markdown/reference content with zero
executable surface — no security rating needed.

## 4. Concrete recommendations

**Delete now (clear duplicates/superseded, zero capability loss):**
`design-taste-frontend-v1`, `css-expert`, `react-native-design`, `ask-matt`.

**Pick one and delete the rest (near-identical, same trigger scope):**
- Grill trio → keep `grilling` (clearest name/description), drop `grill-me` + `grill-with-docs` (unless you specifically want the doc-generating variant, in which case keep `grill-with-docs` instead and drop the other two).
- Skill-authoring trio: `skill-creator` vs `write-a-skill` vs `writing-great-skills` → keep `skill-creator` (most complete tooling), drop the other two.
- Docs: `documentation` vs `documentation-writer` → keep whichever phrasing style you prefer, drop the other.
- Deepening-module pair: `codebase-design` vs `improve-codebase-architecture` → keep one.
- Image-first web workflow: `image-to-code` vs `imagegen-frontend-web` → keep one.
- "Make it expensive" style pair: `gpt-taste` vs `high-end-visual-design` → keep one.

**Keep but be aware of trigger overlap (no action needed, just know which wins):**
`code-review` / `caveman-review` / `thermo-nuclear-code-quality-review`; the whole 28-skill frontend cluster if you genuinely want that many style options — this only becomes a problem if the model picks a style skill you didn't intend, which is a prompt-specificity fix, not a deletion.

**Security action:**
Read `~/.agents/skills/impeccable/reference/hooks.md` fully before ever invoking `impeccable hooks on` in a repo with collaborators — it can write a committed, team-shared hook file (`.github/hooks/impeccable.json`) that auto-runs its 12MB binary for everyone who pulls the branch.

**Stack-relevance sweep:**
If you don't actively work in Flutter, Go, or Svelte, drop those 8 skills
(`flutter-architecture`, `flutter-riverpod-expert`, `golang-code-style`,
`golang-dependency-management`, `golang-error-handling`, `golang-performance`,
`golang-project-layout`, `svelte-code-writer`) — pure dead weight, no
conflict/security angle, just unused surface area in the system prompt.
