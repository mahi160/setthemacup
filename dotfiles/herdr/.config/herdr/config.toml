onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
accent = "#d8a657"
panel_bg = "#282828"
sidebar_bg = "#282828"
active_row_bg = "#3c3836"
selection_bg = "#504945"
surface0 = "#3c3836"
surface1 = "#504945"
surface_dim = "#282828"
overlay0 = "#928374"
overlay1 = "#7c6f64"
text = "#d4be98"
subtext0 = "#928374"
mauve = "#d3869b"
green = "#a9b665"
yellow = "#d8a657"
red = "#ea6962"
blue = "#7daea3"
teal = "#89b482"
peach = "#e78a4e"

[ui]
show_agent_labels_on_pane_borders = true

# ── Status bar (migrated from tmux) ───────────────────────────────────────────
tab_bar_right = [
  { type = "command", command = "~/.local/bin/tmux-nowplaying", interval_seconds = 1, timeout_seconds = 2 },
  { type = "command", command = "/opt/homebrew/bin/python3 ~/.setup/claude-tmux.py | sed -E 's/#\\[[^]]*\\]//g'", interval_seconds = 5, timeout_seconds = 2 },
  { type = "text", text = "  " },
]
tab_bar_right_separator = " │ "

# ── Keybindings (migrated from tmux, prefix + note only for now) ─────────────
status_indicators = "symbols"
[keys]
prefix = "ctrl+a"
settings = ""           # frees prefix+s — default settings panel, unused here
workspace_picker = "prefix+s"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "alt+n"
type = "popup"
command = "quick-note"
width = "60%"
height = "20%"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "setthemacup.dev-layout.apply"
description = "dev layout for current dir"
