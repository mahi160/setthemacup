# Everforest Dark Hard
set -g @thm_bg      "#272e33"
set -g @thm_fg      "#d3c6aa"
set -g @thm_acc1    "#7fbbb3"  # blue   — session badge, pane border
set -g @thm_acc2    "#a7c080"  # green  — active window tab
set -g @thm_acc3    "#e67e80"  # red    — prefix, highlights
set -g @thm_gray    "#859289"  # grey1  — separators, inactive
set -g @thm_darkgray "#2e383c" # bg1    — status bar bg

# tmux 3.8+ palette (theme* colours in popups, menus, choose-tree, copy mode)
set -sq dark-theme-black      "#272e33"
set -sq dark-theme-white      "#d3c6aa"
set -sq dark-theme-light-grey "#859289"
set -sq dark-theme-dark-grey  "#2e383c"
set -sq dark-theme-green      "#a7c080"
set -sq dark-theme-yellow     "#dbbc7f"
set -sq dark-theme-red        "#e67e80"
set -sq dark-theme-blue       "#7fbbb3"
set -sq dark-theme-cyan       "#83c092"
set -sq dark-theme-magenta    "#d699b6"
