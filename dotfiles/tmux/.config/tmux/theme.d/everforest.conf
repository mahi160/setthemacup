# Everforest Dark Hard
set -g @thm_bg      "#272e33"
set -g @thm_fg      "#d3c6aa"
set -g @thm_acc1    "#7fbbb3"  # blue   — session badge, pane border
set -g @thm_acc2    "#a7c080"  # green  — active window tab
set -g @thm_acc3    "#e67e80"  # red    — prefix, highlights
set -g @thm_gray    "#859289"  # grey1  — separators, inactive
set -g @thm_darkgray "#2e383c" # bg1    — status bar bg
