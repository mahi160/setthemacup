# Gruvbox Material
set -g @thm_bg      "#282828"
set -g @thm_fg      "#d4be98"
set -g @thm_acc1    "#7daea3"  # aqua   — session badge, pane border
set -g @thm_acc2    "#d8a657"  # yellow — active window tab
set -g @thm_acc3    "#ea6962"  # red    — prefix, highlights
set -g @thm_gray    "#928374"  # gray   — separators, inactive
set -g @thm_darkgray "#32302f" # bg1    — status bar bg

# tmux 3.8+ palette (theme* colours in popups, menus, choose-tree, copy mode)
set -sq dark-theme-black      "#282828"
set -sq dark-theme-white      "#d4be98"
set -sq dark-theme-light-grey "#928374"
set -sq dark-theme-dark-grey  "#32302f"
set -sq dark-theme-green      "#a9b665"
set -sq dark-theme-yellow     "#d8a657"
set -sq dark-theme-red        "#ea6962"
set -sq dark-theme-blue       "#7daea3"
set -sq dark-theme-cyan       "#89b482"
set -sq dark-theme-magenta    "#d3869b"
