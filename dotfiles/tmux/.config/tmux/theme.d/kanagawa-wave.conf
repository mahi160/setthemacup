# Kanagawa Wave
set -g @thm_bg      "#1f1f28"
set -g @thm_fg      "#dcd7ba"
set -g @thm_acc1    "#7e9cd8"  # crystalBlue — session badge, pane border
set -g @thm_acc2    "#98bb6c"  # springGreen — active window tab
set -g @thm_acc3    "#e46876"  # waveRed     — prefix, highlights
set -g @thm_gray    "#727169"  # fujiGray    — separators, inactive
set -g @thm_darkgray "#2a2a37" # sumiInk4    — status bar bg

# tmux 3.8+ palette (theme* colours in popups, menus, choose-tree, copy mode)
set -sq dark-theme-black      "#1f1f28"
set -sq dark-theme-white      "#dcd7ba"
set -sq dark-theme-light-grey "#727169"
set -sq dark-theme-dark-grey  "#2a2a37"
set -sq dark-theme-green      "#98bb6c"
set -sq dark-theme-yellow     "#e6c384"
set -sq dark-theme-red        "#e46876"
set -sq dark-theme-blue       "#7e9cd8"
set -sq dark-theme-cyan       "#7aa89f"
set -sq dark-theme-magenta    "#957fb8"
